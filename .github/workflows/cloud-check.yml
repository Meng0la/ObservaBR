name: Verificar API no Supabase
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node scripts/cloud-smoke.ts
        env:
          DATABASE_URL: ${{ secrets.OBSERVABR_API_DATABASE_URL }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/infrastructure/certs/supabase-prod-ca-2021.crt
