name: Backup de producao temporario
# Operational one-shot; removed immediately after the encrypted artifact is recovered.

on:
  push:
    branches: [data-engineering-controlled-ingestion]
    paths: [.github/workflows/production-backup-once.yml]

permissions:
  contents: read

jobs:
  encrypted-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
      - name: Criar dump com TLS verificado
        env:
          DATABASE_URL: ${{ secrets.OBSERVABR_SCOUT_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$PWD/infrastructure/certs/supabase-prod-ca-2021.crt:/root/.postgresql/root.crt:ro" \
            -e DATABASE_URL \
            postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7 \
            pg_dump --dbname="$DATABASE_URL" --format=plain --schema=observabr \
              --schema-only --no-owner --no-acl --no-password --lock-wait-timeout=15s \
              --file=/work/production.dump
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$PWD/infrastructure/certs/supabase-prod-ca-2021.crt:/root/.postgresql/root.crt:ro" \
            -e DATABASE_URL \
            postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7 \
            pg_dump --dbname="$DATABASE_URL" --format=plain --data-only \
              --enable-row-security --no-owner --no-acl --no-password --lock-wait-timeout=15s \
              --table=observabr.api_snapshots \
              --table=observabr.collection_jobs \
              --table=observabr.collection_requests \
              --table=observabr.data_revisions \
              --table=observabr.enrichment_documents \
              --table=observabr.enrichment_jobs \
              --table=observabr.entity_contexts \
              --table=observabr.records \
              --table=observabr.source_documents \
              --file=/work/production-data.sql
          cat production-data.sql >> production.dump
          printf "\nSELECT pg_catalog.setval('observabr.data_revisions_revision_seq', COALESCE((SELECT max(revision) FROM observabr.data_revisions), 1), EXISTS (SELECT 1 FROM observabr.data_revisions));\n" >> production.dump
          rm production-data.sql
      - name: Cifrar, autenticar e eliminar texto claro
        env:
          BACKUP_KEY_HEX: ${{ secrets.OBSERVABR_BACKUP_KEY_HEX }}
          BACKUP_PLAIN: production.dump
          BACKUP_ENCRYPTED: observabr-production.obr
          BACKUP_VERIFY: verification.dump
          BACKUP_MANIFEST: observabr-production.json
        run: node .github/scripts/production-backup-once.mjs
      - name: Publicar somente copia cifrada
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observabr-production-encrypted
          path: |
            observabr-production.obr
            observabr-production.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
