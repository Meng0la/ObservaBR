name: Backup de producao temporario
# Operational one-shot; removed immediately after the encrypted artifact is recovered.

on:
  push:
    branches: [data-engineering-controlled-ingestion]
    paths: [.github/workflows/production-backup-once.yml]

permissions:
  contents: read

jobs:
  encrypted-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
      - name: Criar dump com TLS verificado
        env:
          DATABASE_URL: ${{ secrets.OBSERVABR_SCOUT_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          mkdir -p production-restore/data
          cat > production-export.sql <<'SQL'
          \copy observabr.source_documents to '/work/production-restore/data/source_documents.csv' with (format csv, header true)
          \copy observabr.records to '/work/production-restore/data/records.csv' with (format csv, header true)
          \copy observabr.data_revisions to '/work/production-restore/data/data_revisions.csv' with (format csv, header true)
          \copy observabr.collection_jobs to '/work/production-restore/data/collection_jobs.csv' with (format csv, header true)
          \copy observabr.collection_requests to '/work/production-restore/data/collection_requests.csv' with (format csv, header true)
          \copy observabr.api_snapshots to '/work/production-restore/data/api_snapshots.csv' with (format csv, header true)
          \copy observabr.enrichment_jobs to '/work/production-restore/data/enrichment_jobs.csv' with (format csv, header true)
          \copy observabr.entity_contexts to '/work/production-restore/data/entity_contexts.csv' with (format csv, header true)
          \copy observabr.enrichment_documents to '/work/production-restore/data/enrichment_documents.csv' with (format csv, header true)
          SQL
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$PWD/infrastructure/certs/supabase-prod-ca-2021.crt:/root/.postgresql/root.crt:ro" \
            -e DATABASE_URL \
            postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7 \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /work/production-export.sql
          rm production-export.sql
          cp supabase/migrations/20261125000100_core.sql production-restore/
          cp supabase/migrations/20261125000200_observacoes.sql production-restore/
          cp supabase/migrations/20261126114431_enrichment.sql production-restore/
          cp supabase/migrations/20261126115334_cloud_service_roles.sql production-restore/
          cp supabase/migrations/20261126115831_cloud_security.sql production-restore/
          cat > production-restore/20261127150000_production_data.sql <<'SQL'
          \copy observabr.source_documents from 'data/source_documents.csv' with (format csv, header true)
          \copy observabr.records from 'data/records.csv' with (format csv, header true)
          \copy observabr.data_revisions from 'data/data_revisions.csv' with (format csv, header true)
          \copy observabr.collection_jobs from 'data/collection_jobs.csv' with (format csv, header true)
          \copy observabr.collection_requests from 'data/collection_requests.csv' with (format csv, header true)
          \copy observabr.api_snapshots from 'data/api_snapshots.csv' with (format csv, header true)
          \copy observabr.enrichment_jobs from 'data/enrichment_jobs.csv' with (format csv, header true)
          \copy observabr.entity_contexts from 'data/entity_contexts.csv' with (format csv, header true)
          \copy observabr.enrichment_documents from 'data/enrichment_documents.csv' with (format csv, header true)
          SELECT pg_catalog.setval('observabr.data_revisions_revision_seq', COALESCE((SELECT max(revision) FROM observabr.data_revisions), 1), EXISTS (SELECT 1 FROM observabr.data_revisions));
          SQL
          printf '%s\n' \
            20261125000100_core.sql \
            20261125000200_observacoes.sql \
            20261126114431_enrichment.sql \
            20261126115334_cloud_service_roles.sql \
            20261126115831_cloud_security.sql \
            20261127150000_production_data.sql > production-restore/RESTORE_ORDER.txt
          tar -cf production.dump -C production-restore .
          rm -rf production-restore
      - name: Cifrar, autenticar e eliminar texto claro
        env:
          BACKUP_KEY_HEX: ${{ secrets.OBSERVABR_BACKUP_KEY_HEX }}
          BACKUP_PLAIN: production.dump
          BACKUP_ENCRYPTED: observabr-production.obr
          BACKUP_VERIFY: verification.dump
          BACKUP_MANIFEST: observabr-production.json
        run: node .github/scripts/production-backup-once.mjs
      - name: Publicar somente copia cifrada
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observabr-production-encrypted
          path: |
            observabr-production.obr
            observabr-production.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
