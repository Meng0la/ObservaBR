name: Verificação
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres-test:
        image: postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
        env:
          POSTGRES_DB: observabr_test
          POSTGRES_PASSWORD: ci-ephemeral-test
        ports:
          - 127.0.0.1:55433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Executar testes com banco isolado
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-ephemeral-test@127.0.0.1:55433/observabr_test
        run: |
          for migration in supabase/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          npm test
      - name: Compilar e verificar separação de segredos
        shell: bash
        run: |
          export BUILD_SECRET_CANARY="$(openssl rand -hex 32)"
          export DATABASE_URL="postgresql://build:$BUILD_SECRET_CANARY@localhost/observabr_test"
          export SUPABASE_SERVICE_ROLE_KEY="$BUILD_SECRET_CANARY"
          export WRITER_PASSWORD="$BUILD_SECRET_CANARY"
          npm run build
          node tests/client-secrets.mjs
      - name: Verificar dashboard em Chromium
        run: |
          npx --no-install playwright install --with-deps chromium
          node --test apps/web/tests/browser.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - name: Verificar imagem, migrações e API de leitura
        shell: bash
        run: |
          for key in POSTGRES_PASSWORD READER_PASSWORD WRITER_PASSWORD; do
            printf '%s=%s\n' "$key" "$(openssl rand -hex 24)" >> .env
          done
          docker compose up -d --build api
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:3000/api/summary | jq -e '.counts and .states'
          node tests/http-smoke.mjs
          docker compose exec -T db psql -U postgres -d observabr -v ON_ERROR_STOP=1 -f - < tests/database-smoke.sql
      - if: always()
        run: if [ -f .env ]; then docker compose down --volumes; fi
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Examinar histórico de segredos
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 git /repo --redact
  appsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep OWASP
        run: >-
          docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.145.0@sha256:b68f9b68483955b85042dac7b4533757779625a02dcf91e470da4c2df1b430be
          semgrep scan --error --config p/owasp-top-ten /src/apps /src/packages /src/scripts
      - name: Construir imagem imutável
        run: docker build --pull=false -t observabr:security .
      - name: Trivy na imagem
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL observabr:security
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
