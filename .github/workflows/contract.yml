name: Contrato da Câmara
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 2'
permissions:
  contents: read
concurrency:
  group: camara-contract
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - run: node --test tests/camara.test.ts
        env:
          OBSERVABR_LIVE: '1'
